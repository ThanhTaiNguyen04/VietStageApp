name: Native audio GDExtension

on:
  push:
    paths:
      - "src/**"
      - "godot-cpp/**"
      - "SConstruct"
      - "bin/vietstage.gdextension"
      - ".github/workflows/native-audio.yml"
  pull_request:
    paths:
      - "src/**"
      - "godot-cpp/**"
      - "SConstruct"
      - "bin/vietstage.gdextension"
      - ".github/workflows/native-audio.yml"
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
            extra: ""
            artifact: "bin/*.dll"
            expected_debug: "bin/libvietstage.windows.template_debug.x86_64.dll"
            expected_release: "bin/libvietstage.windows.template_release.x86_64.dll"
          - name: linux-x86_64
            os: ubuntu-latest
            platform: linux
            arch: x86_64
            extra: ""
            artifact: "bin/*.so"
            expected_debug: "bin/libvietstage.linux.template_debug.x86_64.so"
            expected_release: "bin/libvietstage.linux.template_release.x86_64.so"
          - name: macos-universal
            os: macos-latest
            platform: macos
            arch: universal
            extra: ""
            artifact: "bin/*.framework/**"
            expected_debug: "bin/libvietstage.macos.template_debug.framework"
            expected_release: "bin/libvietstage.macos.template_release.framework"
          - name: android-arm64
            os: ubuntu-latest
            platform: android
            arch: arm64
            extra: ""
            artifact: "bin/*android*.so"
            expected_debug: "bin/libvietstage.android.template_debug.arm64.so"
            expected_release: "bin/libvietstage.android.template_release.arm64.so"
          - name: ios-arm64
            os: macos-latest
            platform: ios
            arch: arm64
            extra: ""
            artifact: "bin/*ios*.a"
            expected_debug: "bin/libvietstage.ios.template_debug.arm64.a"
            expected_release: "bin/libvietstage.ios.template_release.arm64.a"
          - name: ios-simulator
            os: macos-latest
            platform: ios
            arch: arm64
            extra: "ios_simulator=yes"
            artifact: "bin/*simulator.a"
            expected_debug: "bin/libvietstage.ios.template_debug.simulator.a"
            expected_release: "bin/libvietstage.ios.template_release.simulator.a"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install "scons==4.8.1"

      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'

      - name: Install pinned Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: sdkmanager "ndk;28.1.13356709"

      - name: Build debug library
        shell: bash
        run: scons platform=${{ matrix.platform }} target=template_debug arch=${{ matrix.arch }} ${{ matrix.extra }} -j2

      - name: Build release library
        shell: bash
        run: scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }} ${{ matrix.extra }} -j2

      - name: Verify manifest artifact exists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = [Path("${{ matrix.expected_debug }}"), Path("${{ matrix.expected_release }}")]
          missing = [str(path) for path in expected if not path.exists()]
          if missing:
              raise SystemExit("Missing manifest artifacts: " + ", ".join(missing))
          print("\n".join(map(str, expected)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vietstage-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
