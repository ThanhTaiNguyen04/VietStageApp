<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Technology Slide</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf8f5;
            --text-main: #21140d;
            --jade: #173f2d;
            --gold: #c59626;
            --muted: #6f6257;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* 16:9 Slide Container */
        .slide {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            background-image: radial-gradient(circle at 100% 100%, rgba(197, 150, 38, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 0% 0%, rgba(23, 63, 45, 0.05) 0%, transparent 40%);
        }

        /* Decorative Elements */
        .deco-corner-tl {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 80px;
            height: 80px;
            border-top: 3px solid var(--gold);
            border-left: 3px solid var(--gold);
            opacity: 0.7;
        }
        .deco-corner-br {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            border-bottom: 3px solid var(--gold);
            border-right: 3px solid var(--gold);
            opacity: 0.7;
        }
        .deco-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 12px;
            height: 100%;
            background-color: var(--jade);
        }

        /* Header */
        .header {
            padding: 60px 80px 40px 80px;
            display: flex;
            align-items: center;
        }
        
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: var(--text-main);
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
        }
        
        .header h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 60px;
            height: 4px;
            background-color: var(--gold);
        }

        /* Content Area */
        .content {
            display: flex;
            justify-content: space-between;
            padding: 40px 100px;
            height: calc(100% - 170px);
        }

        /* Columns */
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Dividers */
        .col:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10%;
            height: 80%;
            width: 1px;
            background-color: var(--jade);
            opacity: 0.2;
        }

        .col-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Technology Items */
        .tech-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            transition: transform 0.3s ease;
        }

        .tech-item:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid rgba(23, 63, 45, 0.1);
        }

        .icon-box img {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
        }

        .tech-name {
            font-size: 20px;
            font-weight: 500;
            color: var(--muted);
        }
        
        /* Spring Boot adjustment since it's the only one in the column */
        .col-backend .tech-item {
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <div class="slide">
        <!-- Decorative Elements -->
        <div class="deco-bar"></div>
        <div class="deco-corner-tl"></div>
        <div class="deco-corner-br"></div>

        <!-- Header -->
        <div class="header">
            <h1>Project Technology</h1>
        </div>

        <!-- Content -->
        <div class="content">
            
            <!-- Website Column -->
            <div class="col">
                <div class="col-title">Website</div>
                
                <div class="tech-item">
                    <div class="icon-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React JS">
                    </div>
                    <div class="tech-name">React Js</div>
                </div>

                <div class="tech-item">
                    <div class="icon-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg" alt="Tailwindcss">
                    </div>
                    <div class="tech-name">Tailwindcss</div>
                </div>
            </div>

            <!-- Mobile Column -->
            <div class="col">
                <div class="col-title">Mobile</div>
                
                <div class="tech-item">
                    <div class="icon-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React Native">
                    </div>
                    <div class="tech-name">React Native</div>
                </div>

                <div class="tech-item">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:60px; height:60px; color:#38bdf8;">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
                        </svg>
                    </div>
                    <div class="tech-name">Nativewind</div>
                </div>
            </div>

            <!-- Back-end Column -->
            <div class="col col-backend">
                <div class="col-title">Back-end</div>
                
                <div class="tech-item">
                    <div class="icon-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Spring_Framework_Logo_2018.svg" alt="Spring Boot">
                    </div>
                    <div class="tech-name">Spring Boot</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
